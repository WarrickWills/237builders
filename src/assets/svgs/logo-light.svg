<?xml version="1.0" encoding="UTF-8"?>
<!--
  23-7 Builders — Reversed Horizontal Logo (for dark backgrounds)
  Transparent background · 256×64 coordinate space

  Colours:
    White     #FFFFFF  — posts, primary wordmark
    Timber    #B5723A  — boards, BUILDERS sub-wordmark (Forest is too low-contrast on charcoal)
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 64" fill="none"
     role="img" aria-label="23-7 Builders">

  <!-- Deck boards -->
  <rect x="0"  y="17" width="64" height="10" rx="1.5" fill="#B5723A"/>
  <rect x="0"  y="37" width="64" height="10" rx="1.5" fill="#B5723A"/>
  <!-- Fence posts (white on dark) -->
  <rect x="2"  y="7"  width="10" height="50" rx="2"   fill="#FFFFFF"/>
  <rect x="27" y="7"  width="10" height="50" rx="2"   fill="#FFFFFF"/>
  <rect x="52" y="7"  width="10" height="50" rx="2"   fill="#FFFFFF"/>

  <!-- "23-7" -->
  <text
    x="82" y="48"
    font-family="'Barlow Condensed','Arial Black','Helvetica Neue',Helvetica,Arial,sans-serif"
    font-weight="800"
    font-size="44"
    letter-spacing="-1"
    fill="#FFFFFF">23-7</text>

  <!-- "BUILDERS" -->
  <text
    x="84" y="62"
    font-family="'Barlow','Helvetica Neue',Helvetica,Arial,sans-serif"
    font-weight="500"
    font-size="10.5"
    letter-spacing="4.5"
    fill="#B5723A">BUILDERS</text>

</svg>
